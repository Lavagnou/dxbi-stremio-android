name: TV app

# Publishing a release builds Nathflix TV (Android TV) and attaches nathflix-tv.apk to that release.
# Run by hand, it builds it, and attaches it to the release given as "tag" (if any).
#
# Release builds are signed with Nathflix TV's key, kept in the repository's secrets:
#   NATHFLIX_TV_KEYSTORE_B64       the keystore, base64-encoded
#   NATHFLIX_TV_KEYSTORE_PASSWORD  its password (the key uses the same one; alias nathflix-tv)
# Without them the job stops before building, so a release never gets a differently signed APK
# (Android would refuse to install it over the real one).
on:
  release:
    types: [published]
  # By hand: builds the APK, and attaches it to the release given (e.g. v0.2.0, once the signing key
  # is in the secrets), or keeps it as a workflow artifact
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to attach nathflix-tv.apk to (e.g. v0.2.0); empty: just build"
        required: false
  # release.yml calls it with the tag it just published (a release made by the workflow's own token
  # doesn't start the "release" event)
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    env:
      HAS_KEY: ${{ secrets.NATHFLIX_TV_KEYSTORE_B64 != '' }}
    steps:
      - name: Signing key needed
        if: env.HAS_KEY != 'true'
        working-directory: .
        run: |
          echo "::warning::NATHFLIX_TV_KEYSTORE_B64 isn't set: Nathflix TV wasn't built. Attach a locally built, signed nathflix-tv.apk instead."
          exit 0

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.NATHFLIX_TV_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/nathflix-tv.jks"

      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches what's missing
      - name: Build
        if: env.HAS_KEY == 'true'
        run: ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk nathflix-tv.apk
        env:
          NATHFLIX_TV_KEYSTORE: ${{ runner.temp }}/nathflix-tv.jks
          NATHFLIX_TV_KEYSTORE_PASSWORD: ${{ secrets.NATHFLIX_TV_KEYSTORE_PASSWORD }}
          NATHFLIX_TV_KEY_ALIAS: nathflix-tv
          NATHFLIX_TV_KEY_PASSWORD: ${{ secrets.NATHFLIX_TV_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: nathflix-tv
          path: tv/nathflix-tv.apk
          if-no-files-found: error

      - name: Attach to the release
        if: env.HAS_KEY == 'true' && (github.event_name == 'release' || inputs.tag != '')
        run: gh release upload "${{ inputs.tag || github.event.release.tag_name }}" nathflix-tv.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
